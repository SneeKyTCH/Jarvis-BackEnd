name: Keep Render Awake

# Render's free tier puts the service to sleep after ~15 min of inactivity,
# and the first request afterwards takes 30-60s to wake it. This workflow pings
# the public root endpoint every 10 minutes so the container stays warm.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay a few min)
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API root to prevent cold start
        run: |
          echo "Pinging JARVIS backend at $(date -u)..."
          curl -sS --fail --max-time 90 --retry 3 --retry-delay 10 \
            "https://jarvis-api-kx4n.onrender.com/" \
            && echo "" && echo "✅ Backend is awake ($(date -u))" \
            || (echo "❌ Ping failed ($(date -u))"; exit 1)
